name: aws-fullstack
description: A Well Architected full stack AWS application composed from validated packs.

# core is the pack set every aws-fullstack project always gets. Every pack listed already exists in
# the corpus, so the blueprint composes and validates today: react for the frontend, python-fastapi
# for the API and domain, aws-dynamodb for the primary data store behind the backend's repository
# interface, aws-cognito for authentication guarding the backend routes, aws-cdk for the Fargate
# infrastructure, containers-k8s for the image definitions, and github-actions for the promotion
# pipeline.
#
# aws-dynamodb joined core in the data wave: the composed init wiring pass swaps the backend's in
# memory repository for its DynamoDB adapter and composes its table construct into the infra stack.
# aws-cognito joins in the auth wave: its wiring pass guards the backend routes with a Cognito access
# token check and composes its user pool into the infra stack. aws-s3 joins in a later wave.
core:
  - react
  - python-fastapi
  - aws-dynamodb
  - aws-cognito
  - aws-s3
  - aws-cdk
  - containers-k8s
  - github-actions

# slices are optional pack sets added with `--with <name,...>`. Wave 1 slices are documented
# placeholders: each maps to a pack that is not built yet, so requesting one composes the core
# and reports the pending pack rather than failing. They light up as their packs land.
slices:
  async: [aws-messaging]
  search: [aws-opensearch]
  cache: [aws-elasticache]
  streaming: [aws-kinesis]
  sql: [aws-aurora]

# backends name the swappable stack pack that owns the API and domain component. `--backend <token>`
# swaps the default FastAPI backend named in core for the pack the token maps to, leaving every other
# core pack in place. fastapi is the default already listed in core; node composes the TypeScript
# backend instead. Requesting no `--backend` keeps core exactly as written.
backends:
  fastapi: python-fastapi
  node: typescript-node

# compute names the swappable platform pack that owns how the app runs. `--serverless` swaps the
# default Fargate compute named in core for the serverless one, leaving every other core pack in
# place: the same full app composes onto AWS Lambda behind API Gateway instead of ECS Fargate behind
# a load balancer, and the data, auth, and storage packs compose their constructs into the serverless
# infra stack rather than the Fargate one. fargate is the default already listed in core (aws-cdk);
# serverless composes aws-serverless instead. Requesting no `--serverless` keeps core exactly as written.
compute:
  fargate: aws-cdk
  serverless: aws-serverless

# pillars are the cross service laws only a composition can assert. They stay vendor neutral in
# doctrine so a second cloud blueprint reuses them; the AWS packs bind each one where they can.
pillars:
  - EEP-SEC-03
  - EEP-SEC-04
  - EEP-REL-01
  - EEP-REL-02
  - EEP-COST-01

# wiring is reference documentation for how the packs fit together. The first two lines are now
# executed by the composed init wiring pass (aws-dynamodb and aws-cognito are in core); the S3 line
# lands with its pack.
wiring:
  - aws-dynamodb provides the repository implementation for the backend interface
  - aws-cognito provides the API authorizer for the backend routes
  - aws-s3 and CloudFront front the react frontend build

authors: [{ name: Samar Swami, github: "@samar1066" }]
maintainers: ["@samar1066"]
