# Publishes the npm package with provenance when a version tag is pushed.
#
# One time setup on npmjs.com (package settings for engineering-excellence):
# add a Trusted Publisher pointing at this repository (samar1066/engineering-excellence)
# and this workflow file name (release.yml). After that, no tokens and no one
# time passwords are needed: pushing a tag like v0.3.0 runs the full gauntlet
# and publishes with a signed provenance statement linking the package to this
# repository and commit.
name: release
on:
  push:
    tags: ["v*"]
permissions: read-all
jobs:
  gauntlet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: tools/eep/package-lock.json }
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: npm ci
        working-directory: tools/eep
      - run: npm test
        working-directory: tools/eep
      - run: npm run lint
        working-directory: tools/eep
      - run: npx tsx src/index.ts corpus validate
        working-directory: tools/eep
      - name: validate every pack
        run: |
          for p in packs/*/*/; do
            (cd tools/eep && npx tsx src/index.ts pack validate "../../$p")
          done
  publish:
    needs: gauntlet
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Node 22 bundles npm 10, which signs provenance but cannot perform the
      # trusted publishing token exchange; that arrived in npm 11.5.
      - run: npm install -g npm@11.6.1
      - name: install dependencies, retrying transient registry errors
        working-directory: tools/eep
        run: |
          for i in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci attempt $i failed; retrying after backoff" >&2
            sleep $((i * 10))
          done
          echo "npm ci failed after 3 attempts" >&2
          exit 1
      - name: guard tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./tools/eep/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $TAG does not match package version $PKG" >&2
            exit 1
          fi
      - run: npm publish --provenance --access public
        working-directory: tools/eep
      - name: pack the published tarball
        run: cd tools/eep && npm pack
      # A GitHub native build provenance attestation over the release artifact,
      # discoverable on the repository and by supply chain auditors.
      - uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        id: attest
        with:
          subject-path: tools/eep/engineering-excellence-*.tgz
      - name: create the GitHub release with the tarball and its provenance bundle
        env:
          GH_TOKEN: ${{ github.token }}
          # A path produced by the attest step, not untrusted input, but bound through env and quoted
          # rather than interpolated into the shell, per workflow-injection hygiene.
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cd tools/eep
          tgz="$(ls engineering-excellence-*.tgz)"
          # Attach the SLSA provenance bundle as a release asset. The attestation itself lives in
          # GitHub's attestation store, which supply chain scanners (OpenSSF Scorecard's
          # Signed-Releases among them) do not read; a provenance asset on the release is what they
          # look for, and it lets a consumer verify the tarball offline against this bundle.
          cp "$BUNDLE_PATH" "${tgz}.intoto.jsonl"
          gh release create "$GITHUB_REF_NAME" "$tgz" "${tgz}.intoto.jsonl" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag \
            || gh release upload "$GITHUB_REF_NAME" "$tgz" "${tgz}.intoto.jsonl" --clobber
