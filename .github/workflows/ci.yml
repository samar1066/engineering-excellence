name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: tools/eep/package-lock.json }
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: npm ci
        working-directory: tools/eep
      - run: npm test
        working-directory: tools/eep
      - run: npm run lint
        working-directory: tools/eep
      - run: npx tsx src/index.ts corpus validate
        working-directory: tools/eep
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: tools/eep/package-lock.json }
      - run: npm ci
        working-directory: tools/eep
      # Every pack in the corpus, not one named pack: a pack that lands without being added here
      # would otherwise ship unvalidated.
      - name: validate every pack
        working-directory: tools/eep
        run: |
          for dir in ../../packs/*/*/; do
            echo "pack validate $dir"
            npx tsx src/index.ts pack validate "$dir" || exit 1
          done
