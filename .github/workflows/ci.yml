name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: tools/eep/package-lock.json }
      - uses: astral-sh/setup-uv@v3
      - run: npm ci
        working-directory: tools/eep
      - run: npm test
        working-directory: tools/eep
      - run: npx tsx src/index.ts corpus validate
        working-directory: tools/eep
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: tools/eep/package-lock.json }
      - run: npm ci
        working-directory: tools/eep
      - run: npx tsx src/index.ts pack validate ../../packs/stack/python-fastapi
        working-directory: tools/eep
