name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: tools/eep/package-lock.json }
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - run: npm ci
        working-directory: tools/eep
      - run: npm test
        working-directory: tools/eep
      - run: npm run lint
        working-directory: tools/eep
      - run: npx tsx src/index.ts corpus validate
        working-directory: tools/eep
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: tools/eep/package-lock.json }
      - run: npm ci
        working-directory: tools/eep
      # Every pack in the corpus, not one named pack: a pack that lands without being added here
      # would otherwise ship unvalidated.
      - name: validate every pack
        working-directory: tools/eep
        run: |
          for dir in ../../packs/*/*/; do
            echo "pack validate $dir"
            npx tsx src/index.ts pack validate "$dir" || exit 1
          done
