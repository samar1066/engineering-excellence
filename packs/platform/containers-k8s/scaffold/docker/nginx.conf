# Complete nginx configuration for the frontend image built by docker/frontend.Dockerfile. It is a
# whole nginx.conf rather than a conf.d fragment because an unprivileged server has to relocate its
# pid file and every temporary path, which only the top level file can do.

worker_processes auto;
error_log /dev/stderr warn;

# /var/run is not writable by the nginx user, and /tmp always is.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Every path nginx writes to at run time moves under /tmp, so the whole server runs as an
    # unprivileged user with no chown pass in the image.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format main '$remote_addr "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'cid=$upstream_http_x_correlation_id';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # One place names the API. The placeholder below is substituted at image build time from the
    # BACKEND_UPSTREAM build argument in docker/frontend.Dockerfile, which defaults to the compose
    # service name and port, backend:8000.
    upstream backend_upstream {
        server BACKEND_UPSTREAM_PLACEHOLDER;
        keepalive 16;
    }

    server {
        # Above 1024, so binding needs no privilege. The container port is 8080, and the compose
        # file maps a friendlier host port onto it.
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # The typed API client calls /api by default. The trailing slash on proxy_pass strips that
        # prefix, so /api/notes arrives at the backend as /notes, matching what the vite dev server
        # proxy does in frontend/vite.config.ts.
        location /api/ {
            proxy_pass http://backend_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
        }

        # Bundled asset names carry a content hash, so they can cache forever. index.html never
        # does, or a deployed change would keep serving the previous bundle.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # Single page application: an unknown path is a client route, not a missing file.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
