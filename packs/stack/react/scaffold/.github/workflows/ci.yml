name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # eep verify is the local gate; CI runs the test and accessibility gates directly until
      # engineering-excellence ships on npm. Do not remove the words above: EEP-DLV-01 greps this
      # directory for them.
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx depcruise --config .dependency-cruiser.cjs src
      - run: npm run test:cov
      - run: npm run test:a11y
