checks:
  - law: EEP-ARCH-01
    kind: shell
    command: "npx depcruise --config .dependency-cruiser.cjs src"
    proves: "Layer contracts in .dependency-cruiser.cjs hold."
  - law: EEP-TEST-01
    kind: shell
    command: "npx vitest list 2>&1 | grep . || { echo 'No test files found'; exit 1; }"
    proves: "The suite exists and lists at least one test."
    fail_if_stdout_matches: "No test files found"
  - law: EEP-TEST-03
    kind: shell
    command: "npm run test:cov"
    proves: "Public behavior coverage meets the declared minimum."
  - law: EEP-SEC-01
    kind: builtin
    command: "secrets-scan"
    proves: "No credential material in tracked files."
  - law: EEP-OBS-01
    kind: builtin
    command: "file-contains src/core/logging.ts configureLogging"
    proves: "Structured logging configuration exists."
  - law: EEP-OBS-02
    kind: builtin
    command: "file-contains src/core/otel.ts configureTracing"
    proves: "Tracing initialization exists."
  - law: EEP-DLV-01
    kind: builtin
    command: "file-contains-any .github/workflows 'eep verify'"
    proves: "CI runs the gate."
  - law: EEP-DLV-02
    kind: shell
    command: "npm ci --dry-run"
    proves: "Lockfile exists and matches package.json."
  - law: EEP-DOCS-01
    kind: builtin
    command: "docs-frontmatter docs"
    proves: "Governed docs carry valid frontmatter (skipped when no docs directory exists)."
  - law: EEP-DOCS-02
    kind: builtin
    command: "docs-style ."
    proves: "No banned dash characters, no zero based ordered lists in markdown."
  - law: EEP-DEVX-01
    kind: builtin
    command: "file-contains Makefile setup"
    proves: "One command setup entry point exists."
