[project]
name = "{{project_name}}"
version = "0.1.0"
description = "{{project_name}} service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "structlog>=24.1",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "mypy>=1.11",
    "ruff>=0.6",
    "import-linter>=2.0",
    "pre-commit>=3.8",
]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "app.api",
    "app.domain",
]
# app.infrastructure implements app.domain interfaces and must not be imported by app.domain
[[tool.importlinter.contracts]]
name = "Domain never imports infrastructure"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["app.infrastructure", "app.api"]
