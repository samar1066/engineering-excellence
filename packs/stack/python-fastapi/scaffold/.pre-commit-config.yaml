repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: local
    hooks:
      - id: eep-verify
        name: eep verify (changed files)
        entry: bash -c 'if command -v eep >/dev/null 2>&1; then exec eep verify --changed; else exec npx -y engineering-excellence verify --changed; fi'
        language: system
        pass_filenames: false
