repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: local
    hooks:
      - id: eep-verify
        name: eep verify (changed files)
        entry: eep verify --changed
        language: system
        pass_filenames: false
